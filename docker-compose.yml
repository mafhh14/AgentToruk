services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agenttoruk-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: agenttoruk
      POSTGRES_PASSWORD: agenttoruk
      POSTGRES_DB: agenttoruk
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenttoruk -d agenttoruk"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
